# Levanta todo con un solo comando:  docker compose up -d --build
# Sitio: http://localhost:8080   ·   Prueba: http://localhost:8080/api/health
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_quibdo_2026}
      MYSQL_DATABASE: quibdo_empleo
      MYSQL_USER: ${DB_USER:-quibdo_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_quibdo_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      # Se ejecuta SOLO la primera vez (cuando el volumen esta vacio): crea tablas y sectores
      - ./database/quibdo_empleo.sql:/docker-entrypoint-initdb.d/01-quibdo_empleo.sql:ro
    ports:
      - "3308:3306" # opcional: para abrir la base con Workbench en el puerto 3308
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-quibdo_app}
      DB_PASSWORD: ${DB_PASSWORD:-app_quibdo_2026}
      DB_NAME: quibdo_empleo
      PORT: 4000
      # CAMBIA esto antes de usarlo en un servidor real
      JWT_SECRET: ${JWT_SECRET:-cambia_este_texto_por_uno_largo_y_secreto_123456}
    ports:
      - "8080:4000"

volumes:
  mysql_data:
