server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas /api van al contenedor del backend
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
